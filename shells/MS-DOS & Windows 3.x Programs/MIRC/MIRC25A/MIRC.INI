[Text]
dclick=/query $1

[Aliases]
alias0=/op /mode # +ooo $1 $2 $3
alias1=/dop /mode # -ooo $1 $2 $3
alias2=/j /join $1
alias3=/p /part #
alias4=/n /names $1
alias5=/w /whois $1
alias6=/k /kick # $1
alias7=/hop /part # | /join $1
alias8=/send /dcc send $1 $2
alias9=/chat /dcc chat $1

