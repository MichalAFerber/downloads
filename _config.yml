title: Downloads
description: Installers, utilities, and vintage software archives — stable, direct download links.

# Default GitHub Pages project-site URL. Because the site is served from a
# subpath, baseurl carries the repo name.
url: https://michalaferber.github.io
baseurl: "/downloads"

theme: jekyll-theme-cayman

# Repo the Cayman "View on GitHub" button links to.
repository: MichalAFerber/downloads

# Do not show the theme's "Download .zip / .tar.gz" repo-tarball buttons.
show_downloads: false

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Force-serve archive files whose names Jekyll would otherwise skip
# (leading "#" is treated as a temp/backup marker).
include:
  - "#MIRCHEL.LOG"
  - "#QUAKE.LOG"

# Keep repo scaffolding out of the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - .gitignore
